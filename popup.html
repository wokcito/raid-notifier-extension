<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Raid Notifier</title>
    <style>
      body {
        width: 300px;
        font-family: system-ui, sans-serif;
        font-size: 13px;
        padding: 14px;
        color: #1a1a1a;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 10px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      h1 img {
        width: 20px;
        height: 20px;
      }
      #version {
        font-weight: normal;
        color: #999;
        font-size: 11px;
        margin-left: auto;
      }
      label {
        display: block;
        margin-bottom: 4px;
        color: #555;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 6px;
        margin-bottom: 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
      }
      button {
        width: 100%;
        padding: 8px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 13px;
        background: #2563eb;
        color: white;
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      input:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      #logout {
        background: #eee;
        color: #1a1a1a;
        margin-top: 8px;
      }
      #status {
        margin-top: 8px;
        white-space: pre-wrap;
        color: #b91c1c;
      }
      #logged-in {
        display: none;
      }
      #account {
        display: flex;
        align-items: center;
        gap: 6px;
        color: #555;
        margin-bottom: 10px;
      }
      #account-email {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #account-plan {
        flex-shrink: 0;
        padding: 2px 7px;
        border-radius: 10px;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.03em;
        text-transform: uppercase;
      }
      #account-plan.free {
        background: #e5e7eb;
        color: #4b5563;
      }
      #account-plan.premium {
        background: #fef3c7;
        color: #92400e;
      }
      #watched-list {
        list-style: none;
        margin: 0 0 10px;
        padding: 0;
        max-height: 220px;
        overflow-y: auto;
      }
      #watched-list li {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 6px 0;
        border-bottom: 1px solid #eee;
      }
      #watched-list button {
        width: auto;
        padding: 3px 8px;
        background: #fee2e2;
        color: #b91c1c;
        font-size: 12px;
      }
      #watched-empty {
        color: #888;
        padding: 8px 0;
      }
      #channels-list {
        list-style: none;
        margin: 0 0 10px;
        padding: 0;
      }
      .channel {
        padding: 8px 0;
        border-bottom: 1px solid #eee;
      }
      .channel-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
      }
      .channel-name {
        font-weight: 600;
      }
      .channel-linked {
        display: none;
        color: #16a34a;
        font-size: 12px;
      }
      .channel-link-btn {
        display: none;
        width: auto;
        padding: 3px 10px;
        font-size: 12px;
      }
      .channel-actions {
        display: none;
        gap: 6px;
        flex-wrap: wrap;
        margin-top: 8px;
      }
      .channel-actions a,
      .channel-actions button {
        width: auto;
        flex: 1 1 auto;
        padding: 6px 8px;
        font-size: 12px;
        text-decoration: none;
        text-align: center;
        border-radius: 4px;
      }
      .channel-open-link {
        background: #2563eb;
        color: white;
      }
      .channel-copy-btn,
      .channel-qr-btn {
        background: #eee;
        color: #1a1a1a;
      }
      .channel-qr {
        display: none;
        margin-top: 8px;
        text-align: center;
      }
      .channel-qr svg {
        width: 140px;
        height: 140px;
      }
      .channel-hint {
        display: none;
        color: #888;
        font-size: 11px;
        margin-top: 6px;
      }
      #auth-toggle {
        margin-top: 8px;
        font-size: 12px;
        color: #555;
        text-align: center;
      }
      #auth-toggle a {
        color: #2563eb;
        text-decoration: none;
      }
      #update-banner {
        display: none;
        margin-bottom: 10px;
        padding: 8px 10px;
        border-radius: 6px;
        font-size: 12px;
        line-height: 1.4;
      }
      #update-banner a {
        color: inherit;
        font-weight: 600;
      }
      #update-banner.info {
        display: block;
        background: #dbeafe;
        color: #1e40af;
      }
      #update-banner.breaking {
        display: block;
        background: #fee2e2;
        color: #991b1b;
      }
      .section-title {
        display: block;
        margin: 14px 0 8px;
        font-size: 13px;
      }
      #premium-method-row {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 8px;
        font-size: 12px;
        color: #555;
      }
      #premium-method-select {
        width: auto;
        flex: 1 1 auto;
        padding: 5px 6px;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 12px;
        background: white;
        color: #1a1a1a;
      }
      #premium-packages {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: 4px;
      }
      #premium-packages button {
        flex: 1 1 calc(50% - 3px);
        padding: 8px 4px;
        font-size: 12px;
      }
      #premium-cap-hint {
        margin-top: 0;
        margin-bottom: 10px;
      }
      #premium-order {
        margin-bottom: 10px;
        padding: 8px;
        background: #f9fafb;
        border-radius: 6px;
      }
      #premium-order-method {
        color: #888;
        font-size: 11px;
        margin-bottom: 2px;
      }
      #premium-order-status {
        font-weight: 600;
        margin-bottom: 4px;
      }
      #premium-order-amount {
        font-family: monospace;
        font-size: 12px;
        word-break: break-all;
        margin-bottom: 6px;
      }
      #footer {
        margin-top: 12px;
        text-align: center;
        font-size: 11px;
      }
      #footer a {
        color: #999;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <h1><img src="icons/icon32.png" alt="" /> Raid Notifier <span id="version"></span></h1>

    <div id="update-banner"></div>

    <div id="login-form">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="username" />
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" />
      <button id="login">Log in</button>
      <div id="auth-toggle"><span id="auth-toggle-text">Don't have an account? </span><a href="#" id="toggle-mode">Sign up</a></div>
    </div>

    <div id="logged-in">
      <div id="account">
        <span id="account-email"></span>
        <span id="account-plan"></span>
      </div>
      <strong class="section-title">Premium</strong>
      <div id="premium-method-row">
        <label for="premium-method-select">Pay with</label>
        <select id="premium-method-select"></select>
      </div>
      <div id="premium-packages"></div>
      <div id="premium-cap-hint" class="channel-hint" style="display: none"></div>
      <div id="premium-order" style="display: none">
        <div id="premium-order-method"></div>
        <div id="premium-order-status"></div>
        <div id="premium-order-amount"></div>
        <div class="channel-actions" id="premium-order-actions">
          <button id="premium-copy-btn" class="channel-copy-btn" type="button">Copy address</button>
          <button id="premium-qr-btn" class="channel-qr-btn" type="button">Show QR code</button>
        </div>
        <div id="premium-qr" class="channel-qr"></div>
        <div id="premium-expiry" class="channel-hint"></div>
      </div>

      <strong class="section-title">Gyms you're watching</strong>
      <ul id="watched-list"></ul>
      <div id="watched-empty" style="display: none">You're not watching any gyms yet.</div>

      <strong class="section-title">Notifications</strong>
      <ul id="channels-list">
        <li class="channel">
          <div class="channel-row">
            <span class="channel-name">Telegram</span>
            <span id="telegram-linked" class="channel-linked">✅ Linked</span>
            <button id="telegram-link-btn" class="channel-link-btn" type="button">Link</button>
          </div>
          <div id="telegram-actions" class="channel-actions">
            <a id="telegram-open-link" class="channel-open-link" href="#" target="_blank">Open link</a>
            <button id="telegram-copy-btn" class="channel-copy-btn" type="button">Copy link</button>
            <button id="telegram-qr-btn" class="channel-qr-btn" type="button">Show QR code</button>
          </div>
          <div id="telegram-qr" class="channel-qr"></div>
          <div id="telegram-hint" class="channel-hint">After linking in Telegram, reopen this extension to confirm it.</div>
        </li>
      </ul>

      <button id="logout">Log out</button>
    </div>

    <div id="status"></div>

    <div id="footer"><a href="https://github.com/wokcito/raid-notifier-extension" target="_blank">GitHub</a></div>

    <script src="popup.js"></script>
  </body>
</html>
